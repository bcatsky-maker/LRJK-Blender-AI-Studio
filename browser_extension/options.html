<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LRJK AI Studio - Bridge Token</title>
  <style>
    body { font-family: sans-serif; width: 320px; padding: 12px; background: #1e1e1e; color: #d4d4d4; }
    label { display: block; margin-bottom: 6px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 10px; }
    button { padding: 6px 12px; cursor: pointer; }
    p { font-size: 12px; color: #aaaaaa; }
    #status { font-size: 12px; color: #4EC9B0; margin-left: 8px; }
  </style>
</head>
<body>
  <label for="token">Bridge Token</label>
  <input type="text" id="token" placeholder="Paste token from LRJK AI Studio > AI Settings">
  <button id="save">Save</button>
  <span id="status"></span>
  <p>Copy this from the desktop app's "AI Settings" dialog, under "Blender Bridge Pairing Token".
     Requests to the desktop app without a matching token are rejected.</p>
  <script src="options.js"></script>
</body>
</html>
