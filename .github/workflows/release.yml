name: Cross-Platform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build LRJK AI Studio (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: 'Windows x64'
            asset_pattern: 'installer_output/LRJK_Blender_AI_Studio_Setup_*.exe'

          - os: ubuntu-latest
            target_name: 'Linux x64'
            asset_pattern: |
              dist/LRJK_Blender_AI_Studio_Linux_*.AppImage
              dist/lrjk-blender-ai-studio_*.deb
              dist/lrjk-blender-ai-studio-*.rpm

          - os: macos-latest
            target_name: 'macOS'
            asset_pattern: |
              dist/LRJK_Blender_AI_Studio_macOS_*.dmg
              dist/LRJK_Blender_AI_Studio_macOS_*.zip

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # 3. Install Python dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================================================================
      # 4. SCCACHE & C-COMPILER SETUP FOR CYTHON COMPILATION
      # =========================================================================
      - name: Setup sccache Compiler Cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup MSVC C/C++ Compiler (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup GCC C/C++ Compiler & Python Dev Headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ python3-dev

      - name: Setup Clang Compiler Environment (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Configure Compiler Environment Variables for Cython
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "CC=sccache cl" >> $GITHUB_ENV
            echo "CXX=sccache cl" >> $GITHUB_ENV
          elif [ "${{ runner.os }}" = "Linux" ]; then
            echo "CC=sccache gcc" >> $GITHUB_ENV
            echo "CXX=sccache g++" >> $GITHUB_ENV
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "CC=sccache clang" >> $GITHUB_ENV
            echo "CXX=sccache clang++" >> $GITHUB_ENV
          fi

      # =========================================================================
      # 5. OS-SPECIFIC PACKAGING DEPENDENCIES
      # =========================================================================
      - name: Cache Inno Setup
        if: runner.os == 'Windows'
        id: cache-innosetup
        uses: actions/cache@v4
        with:
          path: 'C:\Program Files (x86)\Inno Setup 6'
          key: ${{ runner.os }}-innosetup-6

      - name: Install Inno Setup
        if: runner.os == 'Windows' && steps.cache-innosetup.outputs.cache-hit != 'true'
        run: choco install innosetup -y

      - name: Decode Windows Certificate
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            Write-Host "⚠️ WINDOWS_CERTIFICATE_BASE64 secret not set. Building unsigned."
          } else {
            $certPath = "${{ runner.temp }}\certificate.pfx"
            $certBytes = [System.Convert]::FromBase64String($env:CERT_BASE64)
            [System.IO.File]::WriteAllBytes($certPath, $certBytes)
            Write-Host "🟢 Certificate stored at $certPath"
          }

      - name: Install Linux Packaging Tools (FUSE, Ruby, fpm, rpm)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fuse libfuse2 desktop-file-utils ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: Install macOS Packaging Tools (create-dmg)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Install Apple Certificate
        if: runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: 'temp_ci_keychain_pass'
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/build_certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/build_certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      # =========================================================================
      # 6. EXECUTE FULL BUILD PIPELINE (Cython -> PyInstaller -> Package)
      # =========================================================================
      - name: Execute Full Build Pipeline (build_all.py)
        shell: bash
        env:
          CERT_FILE_PATH: ${{ runner.temp }}/certificate.pfx
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          python build_all.py

      - name: Show sccache Performance Stats
        if: always()
        run: sccache --show-stats

      # =========================================================================
      # 7. POST-BUILD SIGNING & NOTARIZATION (macOS)
      # =========================================================================
      - name: Code Sign & Notarize macOS DMG
        if: runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_BASE64 != ''
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          DMG_PATH="dist/LRJK_Blender_AI_Studio_macOS_v${VERSION}.dmg"

          if [ -f "$DMG_PATH" ]; then
            echo "🔏 Signing $DMG_PATH..."
            codesign --force --sign "$CODESIGN_IDENTITY" "$DMG_PATH"

            echo "🚀 Submitting DMG to Apple Notary Service..."
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait

            echo "🏷️ Stapling ticket..."
            xcrun stapler staple "$DMG_PATH"
          fi

      # =========================================================================
      # 8. SECURE CERTIFICATE CLEANUP
      # =========================================================================
      - name: Cleanup Windows Certificate
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          $certPath = "${{ runner.temp }}\certificate.pfx"
          if (Test-Path $certPath) { Remove-Item $certPath -Force }

      - name: Cleanup macOS Keychain
        if: always() && runner.os == 'macOS'
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then security delete-keychain $KEYCHAIN_PATH; fi
          rm -f $RUNNER_TEMP/build_certificate.p12

      # =========================================================================
      # 9. PUBLISH RELEASE ASSETS TO GITHUB
      # =========================================================================
      - name: Publish Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_pattern }}
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}